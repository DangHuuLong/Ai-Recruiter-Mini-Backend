name: Build and publish Docker image

on:
  push:
    # Deploys from main, not develop — develop is the integration branch (feature/*
    # branches merge here first); main only receives promoted release/* branches, so
    # every push to main is meant to go live. See release/* branches for the promotion
    # step (branch off develop when ready, merge into both main and back into develop).
    branches: [main]

env:
  IMAGE: ghcr.io/danghuulong/ai-recruiter-mini-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
